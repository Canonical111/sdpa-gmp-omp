name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openmp: ["yes", "no"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool
      - run: autoreconf -fi
      - run: ./configure --enable-openmp=${{ matrix.openmp }}
      - run: make -j"$(nproc)" || true
      - name: SPOOLES CC fix if the first make stopped there
        run: |
          if [ ! -x sdpa_gmp ] && [ -f external/spooles/work/internal/Make.inc ]; then
            sed -i 's|^# CC = gcc|  CC = gcc|' external/spooles/work/internal/Make.inc
            ( cd external/spooles/work/internal && find . -name '*.o' -delete && rm -f spooles.a \
              && make global -f makefile && cp spooles.a ../../../i/SPOOLES/lib/libspooles.a )
          fi
      - run: make -j"$(nproc)"
      - name: OpenMP linkage matches the matrix
        run: |
          n=$(ldd sdpa_gmp | grep -c gomp || true)
          [ "${{ matrix.openmp }}" = yes ] && [ "$n" -ge 1 ] || { [ "${{ matrix.openmp }}" = no ] && [ "$n" -eq 0 ]; }
      - run: ./sdpa_gmp -ds example1.dat-s -o out.result -p param.sdpa && grep objValPrimal out.result
      - name: reject unsafe non-GMP output formats
        run: |
          cp param.sdpa bad-format.sdpa
          sed -i '12s/%+50.40Fe/%+8.3e/' bad-format.sdpa
          if ./sdpa_gmp -ds example1.dat-s -o bad-format.result -p bad-format.sdpa >bad-format.log 2>&1; then
            echo 'unsafe double format was accepted for an mpf_t value' >&2
            exit 1
          fi
          grep -q 'invalid GMP xPrint format' bad-format.log
      - name: fatal errors must exit non-zero
        run: |
          set -u
          fail() { echo "FAIL: $1" >&2; exit 1; }
          run_rc() { set +e; "$@" >/dev/null 2>&1; echo $?; set -e; }
          # (a) nonexistent data file
          rc=$(run_rc ./sdpa_gmp -ds no_such_file.dat-s -o /tmp/x.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "missing data file returned 0"
          # (b) unwritable output path
          rc=$(run_rc ./sdpa_gmp -ds example1.dat-s -o /nonexistent_dir/x.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "unwritable output returned 0"
          # (c) missing parameter file
          rc=$(run_rc ./sdpa_gmp -ds example1.dat-s -o /tmp/x.out -p no_such_param.sdpa)
          [ "$rc" -ne 0 ] || fail "missing parameter file returned 0"
          # (d) a successful solve must still be 0
          rc=$(run_rc ./sdpa_gmp -ds example1.dat-s -o /tmp/ok.out -p param.sdpa)
          [ "$rc" -eq 0 ] || fail "successful solve returned $rc"
      - name: malformed input is rejected, never silently solved
        run: |
          set -u
          fail() { echo "FAIL: $1" >&2; exit 1; }
          run_rc() { set +e; "$@" >/dev/null 2>&1; echo $?; set -e; }
          # negative entry index: used to write out of bounds and print a full solution
          awk 'NR==5 {print "1 1 -3 -3 1.0"; next} {print}' example1.dat-s > neg-index.dat-s
          rc=$(run_rc ./sdpa_gmp -ds neg-index.dat-s -o /tmp/neg.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "negative index accepted (rc=0)"
          grep -q objValPrimal /tmp/neg.out 2>/dev/null && fail "negative index produced a solution"
          # block index out of range
          awk 'NR==5 {print "1 99 1 1 1.0"; next} {print}' example1.dat-s > bad-block.dat-s
          rc=$(run_rc ./sdpa_gmp -ds bad-block.dat-s -o /tmp/bb.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "out-of-range block index accepted (rc=0)"
          # comment-only file: used to loop forever writing output
          printf '*comment only\n' > cmt.dat-s
          set +e; timeout 20 ./sdpa_gmp -ds cmt.dat-s -o /tmp/cmt.out -p param.sdpa >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" -ne 124 ] || fail "comment-only file still hangs (timed out)"
          [ "$rc" -ne 0 ] || fail "comment-only file returned 0"
          # truncated file
          head -3 example1.dat-s > trunc.dat-s
          rc=$(run_rc ./sdpa_gmp -ds trunc.dat-s -o /tmp/tr.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "truncated file returned 0"
      - name: 1-thread and 8-thread results are identical (determinism guarantee)
        if: matrix.openmp == 'yes'
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=1 ./sdpa_gmp -ds example1.dat-s -o t1.out -p param.sdpa >/dev/null
          OMP_NUM_THREADS=8 ./sdpa_gmp -ds example1.dat-s -o t8.out -p param.sdpa >/dev/null
          # Select the solution-bearing content rather than excluding timing lines: an
          # exclusion list has to know every timer format the solver can print and rots
          # silently when one is added. Two parts: the scalar convergence fields, and the
          # WHOLE final solution section from "xVec =" onward -- matrix continuation rows
          # are indented, so a "^{" pattern would compare only each block's first row.
          # The timing block follows the matrices, hence the time= drop.
          sel() {
            grep -E 'objValPrimal|objValDual|phase\.value|Iteration =|relative gap|feas\.error' "$1" || true
            awk '/^xVec *=/{f=1} f && !/time *=/' "$1"
          }
          # Write to regular files: `test -s <(...)` is always false, because process
          # substitution exposes a pipe and a pipe reports size zero.
          sel t1.out > t1.selected
          sel t8.out > t8.selected
          test -s t1.selected || { echo "FAIL: selector matched nothing" >&2; exit 1; }
          grep -q '^  *{' t1.selected || { echo "FAIL: no indented matrix rows captured" >&2; exit 1; }
          diff -u t1.selected t8.selected || { echo "FAIL: 1 vs 8 threads differ" >&2; exit 1; }
          # Positive control: perturbing an indented continuation row MUST be detected.
          # (awk, not `sed '0,/re/'` -- that range form is a GNU extension and is a silent
          # no-op under BSD sed, which would make this control vacuous on some runners.)
          awk 'BEGIN{done=0} /^[[:space:]]+\{/ && !done {print "  {9.99e+99"; done=1; next} {print}' \
            t1.selected > t1.mutated
          if diff -q t1.selected t1.mutated >/dev/null; then
            echo "FAIL: positive control did not mutate anything -- the check is vacuous" >&2; exit 1
          fi
          if diff -q t1.mutated t8.selected >/dev/null; then
            echo "FAIL: comparison cannot detect a changed matrix row" >&2; exit 1
          fi
# Job C -- -ftrivial-auto-var-init=zero vs =pattern must give identical output.
# This is the method that found the iMlaenv block-size bug. ASan cannot see an
# in-bounds uninitialised stack read; this can.
# Verified 2026-08-04 on pi (gcc 13.3.0) on all three forks at their dev tips.
  auto-var-init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool
      - name: compiler must support the flag at all
        run: |
          printf 'int main(){return 0;}\n' > /tmp/a.c
          gcc -ftrivial-auto-var-init=pattern -c /tmp/a.c -o /tmp/a.o \
            || { echo "FAIL: toolchain lacks -ftrivial-auto-var-init (needs GCC >= 12)" >&2; exit 1; }

      - name: build twice, zero and pattern
        run: |
          set -e
          build() {   # $1 = zero|pattern, $2 = destination dir
            rm -rf "$2"; mkdir -p "$2"; tar -c --exclude=.git --exclude="$2" . | tar -x -C "$2"
            ( cd "$2"
              autoreconf -fi >/dev/null 2>&1 || true          # dd / gmp
              ./configure --enable-openmp=yes >/dev/null      # qd: --with-qd-includedir=... --with-qd-libdir=...
              F="-O2 -funroll-all-loops -ftrivial-auto-var-init=$1"
              make -j"$(nproc)" CXXFLAGS="$F" CFLAGS="$F" > build.log 2>&1 || true
              MK=$(find . -path '*spooles*' -name Make.inc | head -1)
              if [ -n "$MK" ] && [ ! -x ./sdpa_gmp ]; then
                sed -i 's|^# CC = gcc|  CC = gcc|' "$MK"; d=$(dirname "$MK")
                ( cd "$d" && find . -name '*.o' -delete && rm -f spooles.a && make global -f makefile >/dev/null 2>&1 \
                  && { cp spooles.a ../../../i/SPOOLES/lib/libspooles.a 2>/dev/null || cp spooles.a ./libspooles.a; } )
                make -j"$(nproc)" CXXFLAGS="$F" CFLAGS="$F" >> build.log 2>&1
              fi
              # Flags MUST go on the make line. sdpa-gmp-omp's configure.ac does
              # AC_SUBST([CXXFLAGS],[""]) and discards configure-time flags entirely;
              # measured, that made this whole job vacuous on gmp (0 of 3671 compile
              # lines carried the flag, yet the two binaries still differed because the
              # build path is embedded -- so "binaries differ" is NOT a valid check).
              c=$(grep -E ' -c ' build.log | grep -c -- '-ftrivial-auto-var-init' || true)
              [ "${c:-0}" -ge 10 ] || { echo "FAIL: only $c compile lines carried the flag" >&2; exit 1; }
              grep -E ' -c ' build.log | grep -- 'sdpa_newton.cpp' | grep -q -- '-ftrivial-auto-var-init' \
                || { echo "FAIL: first-party TUs did not get the flag" >&2; exit 1; }
            )
          }
          build zero    build-zero
          build pattern build-pattern

      - name: identical output, or an uninitialised read has been found
        run: |
          set -u
          for p in SDPLIB/data/control1 SDPLIB/data/theta1 SDPLIB/data/truss5 SDPLIB/data/arch0 SDPLIB/data/gpp100 SDPLIB/data/mcp100; do
            [ -f "$p.dat-s.xz" ] && xz -dkf "$p.dat-s.xz"
          done
          sel() {   # same selector as the committed determinism step
            grep -E 'objValPrimal|objValDual|phase\.value|Iteration =|relative gap|feas\.error' "$1" || true
            awk '/^xVec *=/{f=1} f && !/time *=/' "$1"
          }
          : > z.sel; : > p.sel
          for d in example1 SDPLIB/data/control1 SDPLIB/data/theta1 SDPLIB/data/truss5 \
                   SDPLIB/data/arch0 SDPLIB/data/gpp100 SDPLIB/data/mcp100; do
            f="$d.dat-s"; [ -f "$f" ] || continue
            OMP_NUM_THREADS=2 ./build-zero/sdpa_gmp    -ds "$f" -o zo.out -p param.sdpa >/dev/null 2>&1
            OMP_NUM_THREADS=2 ./build-pattern/sdpa_gmp -ds "$f" -o po.out -p param.sdpa >/dev/null 2>&1
            echo "== $f" >> z.sel; sel zo.out >> z.sel
            echo "== $f" >> p.sel; sel po.out >> p.sel
          done
          test -s z.sel || { echo "FAIL: selector matched nothing" >&2; exit 1; }
          grep -q '^  *{' z.sel || { echo "FAIL: no indented matrix rows captured" >&2; exit 1; }
          # Positive control: a changed continuation row must be detectable.
          awk 'BEGIN{d=0} /^[[:space:]]+\{/ && !d {print "  {9.99e+99"; d=1; next} {print}' z.sel > z.mut
          diff -q z.sel z.mut >/dev/null && { echo "FAIL: control mutated nothing -- check is vacuous" >&2; exit 1; }
          diff -q z.mut p.sel >/dev/null && { echo "FAIL: comparison cannot detect a changed row" >&2; exit 1; }
          diff -u z.sel p.sel || {
            echo "FAIL: zero and pattern disagree -- there is a live uninitialised read." >&2
            echo "Bisect it: build everything =zero, then recompile subsets with =pattern" >&2
            echo "until the answer moves; the subset that moves it holds the read." >&2
            exit 1; }
